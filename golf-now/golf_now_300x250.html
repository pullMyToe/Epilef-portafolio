<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Golf Now 300x250</title>
</head>
<body>

        <!-- banner 300x250 --> 
        <a href="http://www.golfnow.co.uk/" target="_blank">  
            <div id="bannerside" style="width: 300px; height: 250px; border-radius: 5px; overflow: hidden;min-width:300px;"> 
                <div id="logogolf" style="position: relative; width: fit-content;z-index: 1; height: 0; top: 10px; left: 150px;">
                    <iframe src="img/logo-golfnow-01.svg" frameborder="0"></iframe>
                </div>
                <lottie-player id="hoverPlayer" src="img/golfnow-300x250.json"></lottie-player> 
            </div>
        </a>
        <!-- end of banner 300x250 -->






        <!-- Lottie libraries -->
        <script type="text/javascript" src="https://unpkg.com/lottie-interactive@latest/dist/lottie-interactive.js"></script>
        <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
        <script src="https://unpkg.com/@lottiefiles/lottie-interactivity@latest/dist/lottie-interactivity.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.7.8/lottie.min.js" integrity="sha512-w58XJ/0dVbEfZVJoJyBUOTMGBWmIW4jEYJSA0898d2L0Ghpum0FvwK7qTuHhkTctApzrchv3Neli+28ajI4+fg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
        
        <!-- golfnow game script  -->
        <script src="js/golfscript.js"></script>

        


</body>
</html>
